[package]
name = "regente-app"
version = "0.1.0"
edition = "2021"
description = "Regente - canvas de agentes de código (uso pessoal)"
default-run = "regente-app"
license = "MIT"

[lib]
name = "regente_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt"] }
portable-pty = "0.8"
sysinfo = "0.32"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
regente-cli = { path = "../cli" }
